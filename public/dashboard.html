<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeLog · Dashboard</title>
    <style>
      :root {
        --text: #f3f0ff;
        --muted: #a99fce;
        --accent: #a06bff;
        --accent2: #22d3a6;
        --pink: #ff5cf0;
        --add: #34e3b0;
        --rem: #ff6b81;
        --live: #ff4d5e;
        --glass: linear-gradient(165deg, rgba(38, 22, 72, 0.55), rgba(14, 11, 28, 0.62));
        --card: rgba(255, 255, 255, 0.035);
        --border: rgba(167, 134, 255, 0.30);
        --glow: 0 0 22px rgba(160, 107, 255, 0.22);
        --radius: 16px;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
        --l0: #241b3a; --l1: #3a2d6e; --l2: #6a4bd0; --l3: #a06bff; --l4: #ff5cf0;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font); color: var(--text);
        background: #07060e; overflow: hidden;
      }
      /* drifting aurora blobs — the overlay vibe, alive */
      body::before, body::after {
        content: ""; position: fixed; z-index: -1; border-radius: 50%;
        filter: blur(90px); opacity: 0.5; pointer-events: none;
      }
      body::before {
        width: 60vw; height: 60vw; top: -22vw; right: -10vw;
        background: radial-gradient(circle, #3a1d7a, transparent 65%);
        animation: drift1 26s ease-in-out infinite alternate;
      }
      body::after {
        width: 55vw; height: 55vw; bottom: -24vw; left: -12vw;
        background: radial-gradient(circle, #0f3a44, transparent 65%);
        animation: drift2 32s ease-in-out infinite alternate;
      }
      @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(-8vw, 10vh) scale(1.15); } }
      @keyframes drift2 { from { transform: translate(0, 0) scale(1); } to { transform: translate(10vw, -8vh) scale(1.1); } }
      .wrap { width: min(1120px, 94vw); margin: 0 auto; padding: 20px 0; height: 100vh; display: flex; flex-direction: column; gap: 13px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.01em; font-size: 18px; }
      .brand .spark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 18px rgba(124, 92, 255, 0.5); }
      .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .pill.live { background: rgba(255, 77, 94, 0.12); color: var(--live); border-color: rgba(255, 77, 94, 0.3); }
      .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
      .pill.live .dot { animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

      h1.title { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 1px; }
      .sub { color: var(--muted); font-family: var(--mono); font-size: 13px; }

      .panel {
        position: relative; background: var(--glass); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px 20px; overflow: hidden;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--glow), 0 10px 34px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .panel::before {
        content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--pink), transparent); opacity: 0.75;
      }
      .panel h3 {
        margin: 0 0 13px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700;
        color: var(--accent); text-shadow: 0 0 10px rgba(160, 107, 255, 0.5);
      }
      .row { display: grid; grid-template-columns: 1.1fr 1.1fr 0.95fr; gap: 13px; flex: 1; min-height: 0; }
      .row .panel { display: flex; flex-direction: column; }
      @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }

      /* channel panel */
      .chan { display: flex; flex-direction: column; gap: 14px; }
      .chan .c { display: flex; align-items: center; gap: 10px; }
      .chan .badge { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px; }
      .chan .badge.tw { background: rgba(145, 70, 255, 0.15); color: #b794ff; } .chan .badge.yt { background: rgba(255, 0, 51, 0.14); color: #ff6b81; }
      .chan .badge svg { width: 16px; height: 16px; fill: currentColor; }
      .chan .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .chan .nm { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
      .chan .livetag { font-size: 9px; font-weight: 800; letter-spacing: 0.08em; color: #fff; background: var(--live); padding: 2px 6px; border-radius: 5px; box-shadow: 0 0 10px rgba(255,77,94,0.55); }
      .chan .off { font-size: 9px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
      .chan .figs { font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .chan .figs b { color: var(--text); font-size: 14px; }
      .chan .up { color: var(--add); } .chan .empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .chan .empty code { color: #c9aaff; font-family: var(--mono); font-size: 11px; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 18px; }
      @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
      .stat .v { font-family: var(--mono); font-size: 23px; font-weight: 700; text-shadow: 0 0 14px rgba(160, 107, 255, 0.28); }
      .stat .v.add { color: var(--add); } .stat .v.rem { color: var(--rem); }
      .stat .k { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

      .seclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
      .seclist li { font-size: 15px; line-height: 1.35; display: flex; gap: 9px; }
      .sech { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; font-weight: 700; }
      .sech:first-child { margin-top: 0; }
      .empty { color: var(--muted); font-style: italic; }

      /* on-brand neon glyphs (replace emoji) */
      .ic { width: 13px; height: 13px; vertical-align: -2px; display: inline-block; }
      .ic-flame { color: #ff7a3d; filter: drop-shadow(0 0 5px rgba(255, 122, 61, 0.75)); }
      .ic-spark { color: var(--accent2); filter: drop-shadow(0 0 5px rgba(34, 211, 166, 0.65)); }
      .ic-commit { color: #c9aaff; filter: drop-shadow(0 0 4px rgba(160, 107, 255, 0.55)); }

      /* range + project controls */
      .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 1px 0 2px; }
      .seg { display: inline-flex; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; }
      .seg button { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: var(--muted); background: transparent; border: 0; padding: 6px 14px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
      .seg button.on { color: #fff; background: linear-gradient(135deg, var(--accent), var(--pink)); box-shadow: 0 0 14px rgba(160, 107, 255, 0.45); }
      .projbar { display: flex; gap: 7px; flex-wrap: wrap; }
      .projbar button { font: inherit; font-size: 12px; color: var(--muted); background: rgba(160, 107, 255, 0.06); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: all 0.15s; }
      .projbar button:hover { color: var(--text); }
      .projbar button.on { color: #fff; border-color: var(--pink); background: rgba(255, 92, 240, 0.14); box-shadow: 0 0 12px rgba(255, 92, 240, 0.3); }

      /* heatmap — GitHub-style: weekday labels left, month labels on top */
      .cal { display: flex; gap: 7px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
      .cal-side { display: grid; grid-template-rows: repeat(7, 12px); gap: 3px; margin-top: 17px; font-family: var(--mono); font-size: 9px; color: var(--muted); }
      .cal-side span { height: 12px; line-height: 12px; }
      .cal-grid { min-width: 0; }
      .heat-months { display: flex; height: 14px; color: var(--muted); font-size: 10px; font-family: var(--mono); margin-bottom: 3px; }
      .heat-months span { width: 15px; flex: 0 0 15px; white-space: nowrap; }
      .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; }
      .heat .cell { width: 12px; height: 12px; border-radius: 3px; background: var(--l0); }
      .heat .cell.l1 { background: var(--l1); } .heat .cell.l2 { background: var(--l2); }
      .heat .cell.l3 { background: var(--l3); } .heat .cell.l4 { background: var(--l4); }
      .heat .cell.pad { background: transparent; }
      .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 12px; }
      .legend .cell { width: 13px; height: 13px; border-radius: 3px; }

      /* weekly bars */
      .week { display: flex; flex-direction: column; gap: 8px; font-family: var(--mono); font-size: 13px; }
      .week .d { display: grid; grid-template-columns: 64px 1fr 92px; align-items: center; gap: 10px; }
      .week .bar { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent2), var(--accent)); min-width: 2px; }
      .week .meta { color: var(--muted); text-align: right; }
      .week .off { color: var(--muted); opacity: 0.55; }

      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
      .chip { font-family: var(--mono); font-size: 13px; padding: 7px 12px; border-radius: 10px; background: rgba(160, 107, 255, 0.07); border: 1px solid var(--border); }
      .chip b { color: var(--text); } .chip span { color: var(--muted); }

      /* topbar right: channel links + live pill */
      .topright { display: flex; align-items: center; gap: 10px; }
      .social { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
                border-radius: 9px; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
                color: var(--muted); transition: all 0.15s ease; }
      .social svg { width: 17px; height: 17px; fill: currentColor; }
      .social.tw:hover { color: #fff; background: #9146ff; border-color: #9146ff; box-shadow: 0 0 16px rgba(145,70,255,0.5); }
      .social.yt:hover { color: #fff; background: #ff0033; border-color: #ff0033; box-shadow: 0 0 16px rgba(255,0,51,0.45); }
      .social.off { opacity: 0.32; pointer-events: none; }

      /* all-time aggregate strip under the heatmap */
      .alltime { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
      .alltime .a { display: flex; flex-direction: column; gap: 1px; }
      .alltime .a .v { font-family: var(--mono); font-size: 20px; font-weight: 700; }
      .alltime .a .v.tok { color: #c9aaff; } .alltime .a .v.cost { color: var(--accent2); } .alltime .a .v.live { color: var(--pink); }
      .week .livedot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 6px var(--pink); margin-right: 5px; vertical-align: 1px; }
      .alltime .a .k { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><span class="spark"></span> VibeLog</div>
        <div class="topright">
          <a class="social tw off" id="tw" target="_blank" rel="noopener" title="Twitch">
            <svg viewBox="0 0 24 24"><path d="M4 2 2.5 6v14h5v3h3l3-3h4L23 13V2H4Zm17 10-3 3h-5l-3 3v-3H6V4h15v8Z"/><path d="M16 7h2v5h-2zm-5 0h2v5h-2z"/></svg>
          </a>
          <a class="social yt off" id="yt" target="_blank" rel="noopener" title="YouTube">
            <svg viewBox="0 0 24 24"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 5 12 5 12 5s-7 0-8.9.4A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1C5 19 12 19 12 19s7 0 8.9-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.4 12 31 31 0 0 0 23 7.5ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>
          </a>
          <span class="pill" id="livePill"><span class="dot"></span> <span id="liveText">Offline</span></span>
        </div>
      </div>

      <h1 class="title">Dashboard</h1>
      <div class="sub" id="subtitle"></div>

      <div class="controls">
        <div class="seg" id="modeSeg">
          <button data-mode="ai" class="on">AI coding</button>
          <button data-mode="stream">Streaming</button>
          <button data-mode="vibe">VibeLog</button>
        </div>
        <div class="seg" id="rangeSeg">
          <button data-days="31">Month</button>
          <button data-days="371" class="on">Year</button>
        </div>
        <div class="projbar" id="projbar"></div>
      </div>

      <div class="panel">
        <h3 id="heatTitle">Activity — Claude tokens per day</h3>
        <div class="cal">
          <div class="cal-side">
            <span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span>
          </div>
          <div class="cal-grid">
            <div class="heat-months" id="heatMonths"></div>
            <div class="heat" id="heat"></div>
          </div>
        </div>
        <div class="legend">
          <span>less</span>
          <span class="cell" style="background:var(--l0)"></span>
          <span class="cell" style="background:var(--l1)"></span>
          <span class="cell" style="background:var(--l2)"></span>
          <span class="cell" style="background:var(--l3)"></span>
          <span class="cell" style="background:var(--l4)"></span>
          <span>more</span>
          <span id="heatSummary" style="margin-left:auto"></span>
        </div>
        <div class="sub" id="heatCaption" style="margin-top:10px"></div>
        <div class="alltime" id="alltime"></div>
      </div>

      <div class="row">
        <div class="panel">
          <h3>This session</h3>
          <div class="chips" id="todayChips"></div>
          <div class="stats" id="codeStats" style="margin-top:16px"></div>
        </div>
        <div class="panel">
          <h3>This week</h3>
          <div class="week" id="week"></div>
          <div class="chips" id="weekTotals" style="margin-top:14px"></div>
        </div>
        <div class="panel">
          <h3>Channel</h3>
          <div id="social"></div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
      const dur = (m) => { const h = Math.floor(m/60), mm = m%60; return h ? `${h}h ${mm}m` : `${mm}m`; };
      const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

      // On-brand neon glyphs (replace emoji) — small inline SVGs.
      const ICONS = {
        flame: '<svg class="ic ic-flame" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.2 3.2-1 4.4-2 6.4-.9 1.8.2 3.6 2 3.6 1.1 0 1.9-.9 2-2.6 1.9 1.9 3 4 3 6.2a7 7 0 1 1-14 0c0-3 1.7-5.2 3-7 .7 1.8 1.8 2 2.7 1.1C13.6 8 12.8 4.6 12 2Z"/></svg>',
        spark: '<svg class="ic ic-spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.6L20 10l-6.1 1.4L12 18l-1.9-6.6L4 10l6.1-1.4z"/></svg>',
        commit: '<svg class="ic ic-commit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.4"/><path d="M2 12h5.6M16.4 12H22"/></svg>',
      };

      // view state — chart mode, range (days), project scope.
      let MODE_SEL = "ai"; // ai | stream | vibe
      let DAYS_SEL = 371;
      let PROJ_SEL = "all";

      const dhm = (m) => { const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };

      // VibeLog score for a day: a 0–100 blend of AI coding, commits, stream
      // time, and shipped features — the "was this a good vibe session" number.
      function combo(u) {
        if (!u) return 0;
        const tok = Math.min(1, Math.log10((u.tokens || 0) + 1) / 7);
        const com = Math.min(1, (u.commits || 0) / 10);
        const str = Math.min(1, (u.stream || 0) / 240);
        const feat = Math.min(1, (u.features || 0) / 4);
        return Math.round((tok * 0.4 + com * 0.2 + str * 0.3 + feat * 0.1) * 100);
      }

      // The metric each mode colors the calendar by.
      const MODES = {
        ai: { val: (u) => (u && u.tokens) || 0, title: "Activity — Claude tokens per day", word: "AI coding" },
        stream: { val: (u) => (u && u.stream) || 0, title: "Activity — minutes live-streaming", word: "streaming" },
        vibe: { val: (u) => combo(u), title: "Activity — VibeLog score", word: "vibe" },
      };

      function chip(label, value) {
        const d = document.createElement("div");
        d.className = "chip";
        d.innerHTML = `<b>${value}</b> <span>${label}</span>`;
        return d;
      }
      function stat(value, label, cls = "") {
        const d = document.createElement("div");
        d.className = "stat";
        d.innerHTML = `<div class="v ${cls}">${value}</div><div class="k">${label}</div>`;
        return d;
      }

      // Match chart.ts levelFor: relative to busiest day in range.
      function levelFor(score, max) {
        if (score <= 0) return 0;
        if (max <= 0) return 1;
        return Math.min(4, 1 + Math.floor((score / max) * 3.999));
      }

      function renderToday(t, live) {
        const chips = $("todayChips");
        chips.innerHTML = "";
        chips.append(
          chip("active", dur(t.activeMinutes)),
          chip("features", t.features.length),
          chip("fixes", t.bugs.length),
          chip("prompts", t.prompts),
        );

        const s = live.stats || {};
        const cost = s.costUsd || 0;
        const cs = $("codeStats");
        cs.innerHTML = "";
        cs.append(
          stat(fmt(s.features || 0), "features", "add"),
          stat(fmt(s.bugs || 0), "fixes", "rem"),
          stat(fmt(s.claudeTokens || 0), "tokens (session)"),
          stat(cost >= 100 ? "$" + Math.round(cost) : "$" + cost.toFixed(2), "spend (session)"),
          stat(fmt(s.commits || 0), "commits"),
          stat(fmt(s.subAgents || 0), "sub-agents"),
        );
      }

      // Aggregate the days currently in view (range + project scope).
      function renderAllTime(usage) {
        const days = Object.keys(usage);
        let tokens = 0, cost = 0, commits = 0, stream = 0, active = 0, streamDays = 0;
        for (const d of days) {
          const u = usage[d] || {};
          tokens += u.tokens || 0; cost += u.cost || 0; commits += u.commits || 0; stream += u.stream || 0;
          if ((u.tokens || 0) > 0 || (u.commits || 0) > 0) active++;
          if ((u.stream || 0) > 0) streamDays++;
        }
        const el = $("alltime");
        el.innerHTML = "";
        const a = (v, k, cls = "") => {
          const d = document.createElement("div"); d.className = "a";
          d.innerHTML = `<div class="v ${cls}">${v}</div><div class="k">${k}</div>`;
          return d;
        };
        el.append(
          a(fmt(tokens), "tokens", "tok"),
          a("$" + Math.round(cost).toLocaleString(), "spend", "cost"),
          a(fmt(commits), "commits"),
          a((stream / 60).toFixed(stream >= 600 ? 0 : 1) + "h", "live", "live"),
          a(streamDays, "stream days"),
        );
      }

      // Project selector chips: All + one per project, lit when in focus.
      function renderProjects(projects, active) {
        const bar = $("projbar");
        bar.innerHTML = "";
        const mk = (key, label, blurb) => {
          const b = document.createElement("button");
          b.textContent = label;
          if (blurb) b.title = blurb;
          if ((active || "all") === key) b.classList.add("on");
          b.onclick = () => { PROJ_SEL = key; tick(); };
          return b;
        };
        bar.append(mk("all", "All projects", "Every repo combined"));
        for (const p of projects || []) {
          bar.append(mk(p.name, p.name, `${p.blurb} · ${p.commits} commits · ${p.activeDays} active days`));
        }
      }

      function renderSocials(s) {
        const set = (id, url) => {
          const el = $(id);
          if (url) { el.href = url; el.classList.remove("off"); }
          else { el.removeAttribute("href"); el.classList.add("off"); }
        };
        set("tw", s?.twitch);
        set("yt", s?.youtube);
      }

      const SOCIAL_SVG = {
        twitch: '<svg viewBox="0 0 24 24"><path d="M4 2 2.5 6v14h5v3h3l3-3h4L23 13V2H4Zm17 10-3 3h-5l-3 3v-3H6V4h15v8Z"/><path d="M16 7h2v5h-2zm-5 0h2v5h-2z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 5 12 5 12 5s-7 0-8.9.4A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1C5 19 12 19 12 19s7 0 8.9-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.4 12 31 31 0 0 0 23 7.5ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>',
      };
      const NMS = { twitch: "Twitch", youtube: "YouTube" };
      const compact = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? (n/1e3).toFixed(0)+"k" : n.toLocaleString();

      // Channel panel: live status + follower/sub counts + weekly growth.
      function renderSocial(social, growth) {
        const el = $("social");
        el.innerHTML = "";
        const platforms = ["twitch", "youtube"].filter((p) => social && social[p]);
        if (!platforms.length) {
          el.innerHTML = `<div class="empty">No channel connected. Add <code>twitch</code> / <code>youtube</code> creds to <code>~/.vibelog/secrets.json</code> to track live status &amp; growth.</div>`;
          return;
        }
        const wrap = document.createElement("div"); wrap.className = "chan";
        for (const p of platforms) {
          const ch = social[p]; const g = (growth || {})[p] || {};
          const foll = ch.followers ?? g.followers;
          const delta = g.deltaWeek || 0;
          const label = p === "youtube" ? "subs" : "followers";
          const row = document.createElement("div"); row.className = "c";
          row.innerHTML =
            `<span class="badge ${p === "twitch" ? "tw" : "yt"}">${SOCIAL_SVG[p]}</span>` +
            `<div class="meta">` +
              `<div class="nm">${NMS[p]} ${ch.live ? `<span class="livetag">LIVE${ch.viewers != null ? " · " + compact(ch.viewers) : ""}</span>` : '<span class="off">offline</span>'}</div>` +
              `<div class="figs">${foll != null ? `<b>${compact(foll)}</b> ${label}` : "—"}` +
                `${delta ? ` <span class="up">+${compact(delta)}/wk</span>` : ""}` +
                `${ch.views != null ? ` · ${compact(ch.views)} views` : ""}</div>` +
            `</div>`;
          wrap.append(row);
        }
        el.append(wrap);
      }

      function renderWeek(w) {
        const max = Math.max(1, ...w.days.map((d) => d.activeMinutes));
        const el = $("week");
        el.innerHTML = "";
        for (const d of w.days) {
          const dow = DOW[new Date(d.date + "T00:00:00").getDay()];
          const row = document.createElement("div"); row.className = "d";
          const active = !!d.firstTs;
          const live = (d.stream || 0) > 0;
          const dot = live ? '<span class="livedot" title="streamed"></span>' : "";
          const meta = active
            ? (live ? dhm(d.stream) + " live" : dur(d.activeMinutes) + ` · ${ICONS.spark}${d.features.length}`)
            : "—";
          row.innerHTML =
            `<div class="${active ? "" : "off"}">${dot}${dow} ${d.date.slice(5)}</div>` +
            `<div><div class="bar" style="width:${Math.round((d.activeMinutes / max) * 100)}%;${active ? "" : "opacity:.25"}"></div></div>` +
            `<div class="meta">${meta}</div>`;
          el.append(row);
        }
        const t = $("weekTotals");
        t.innerHTML = "";
        t.append(
          chip("active days", `${w.activeDays}/7`),
          chip("shipped", w.features.length),
          chip("live", dhm(w.streamMinutes || 0)),
          chip("total time", dur(w.activeMinutes)),
        );
      }

      // A square per day, colored by the active mode's metric (AI tokens /
      // stream minutes / VibeLog score), relative to the busiest day in range.
      function renderHeat(chart, usage, project) {
        const mode = MODES[MODE_SEL];
        const val = (d) => mode.val(usage[d.date]);
        const max = Math.max(1, ...chart.map(val));
        const first = new Date(chart[0].date + "T00:00:00");
        const pad = first.getDay();
        const heat = $("heat");
        heat.innerHTML = "";
        for (let i = 0; i < pad; i++) { const c = document.createElement("div"); c.className = "cell pad"; heat.append(c); }
        let active = 0, totalTok = 0, totalCost = 0, totalCommits = 0, totalStream = 0;
        for (const day of chart) {
          const u = usage[day.date] || {};
          const v = val(day);
          const lvl = levelFor(v, max);
          if (v > 0) active++;
          totalTok += u.tokens || 0; totalCost += u.cost || 0;
          totalCommits += u.commits || 0; totalStream += u.stream || 0;
          const c = document.createElement("div");
          c.className = "cell" + (lvl ? " l" + lvl : "");
          c.title = `${day.date} · ${fmt(u.tokens || 0)} tok · ${u.commits || 0} commits · ${dhm(u.stream || 0)} live · vibe ${combo(u)}`;
          heat.append(c);
        }
        // month labels aligned to week columns (one span per week)
        const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const weeks = Math.ceil((pad + chart.length) / 7);
        const months = $("heatMonths");
        months.innerHTML = "";
        let lastMon = -1;
        for (let w = 0; w < weeks; w++) {
          const idx = w * 7 - pad; // first day index of this column in `chart`
          const day = chart[Math.max(0, idx)];
          const mon = day ? new Date(day.date + "T00:00:00").getMonth() : -1;
          const span = document.createElement("span");
          span.textContent = mon !== lastMon && mon >= 0 ? MON[mon] : "";
          if (mon !== lastMon) lastMon = mon;
          months.append(span);
        }

        let streak = 0;
        for (let i = chart.length - 1; i >= 0; i--) { if (val(chart[i]) > 0) streak++; else break; }
        const span = chart.length >= 360 ? "last year" : chart.length >= 28 ? "last month" : `last ${chart.length} days`;
        const label = MODE_SEL === "stream" ? "streamed" : MODE_SEL === "vibe" ? "vibing" : "active";
        $("heatTitle").textContent = mode.title + (project ? ` · ${project}` : "");
        $("heatSummary").innerHTML = `${ICONS.flame} ${streak}-day streak · ${active}/${chart.length} ${label}`;
        const caption = MODE_SEL === "stream"
          ? `Each square = one day · ${span} · ${dhm(totalStream)} live · darker = longer streams.`
          : MODE_SEL === "vibe"
            ? `Each square = one day · ${span} · blend of tokens, commits, stream time & features · darker = better session.`
            : `Each square = one day · ${span} · ${fmt(totalTok)} tokens (~$${Math.round(totalCost)}) · darker = more AI coding.`;
        $("heatCaption").innerHTML = caption;
      }

      async function tick() {
        try {
          const url = `/api/dashboard.json?days=${DAYS_SEL}&project=${encodeURIComponent(PROJ_SEL)}`;
          const d = await (await fetch(url, { cache: "no-store" })).json();
          const live = d.live || {};
          const onAir = !!(live.streaming || live.social?.twitch?.live || live.social?.youtube?.live);
          $("liveText").textContent = onAir ? "Live" : "Offline";
          $("livePill").className = "pill" + (onAir ? " live" : "");
          const proj = live.project?.name || live.sessionTitle;
          $("subtitle").textContent = (proj ? proj : "No active session")
            + (live.nowBuilding?.title ? "  ·  › " + live.nowBuilding.title : "")
            + (live.branch ? `   · ${live.branch}` : "");
          renderSocials(d.socials);
          renderSocial(live.social, d.socialGrowth);
          renderProjects(d.projects, d.activeProject);
          renderToday(d.today, live);
          renderWeek(d.week);
          renderHeat(d.chart, d.usageByDay || {}, d.activeProject);
          renderAllTime(d.usageByDay || {});
        } catch (e) {
          $("liveText").textContent = "Agent offline";
        }
      }

      // Chart mode (AI coding / Streaming / VibeLog) — recolors the calendar.
      $("modeSeg").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        MODE_SEL = b.dataset.mode;
        for (const x of $("modeSeg").children) x.classList.toggle("on", x === b);
        tick();
      });

      // Range toggle (Month / Year).
      $("rangeSeg").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        DAYS_SEL = Number(b.dataset.days);
        for (const x of $("rangeSeg").children) x.classList.toggle("on", x === b);
        tick();
      });

      tick();
      setInterval(tick, 4000);
    </script>
  </body>
</html>
