<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeLog Overlay</title>
    <style>
      :root {
        --glass: linear-gradient(165deg, rgba(38, 22, 72, 0.78), rgba(14, 11, 28, 0.82));
        --border: rgba(167, 134, 255, 0.34);
        --text: #f3f0ff;
        --muted: #a99fce;
        --accent: #a06bff;     /* neon purple */
        --accent2: #22d3a6;
        --pink: #ff5cf0;
        --add: #34e3b0;
        --rem: #ff6b81;
        --radius: 16px;
        --gap: 14px;
        --glow: 0 0 22px rgba(160, 107, 255, 0.35);
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: transparent; /* OBS composites over your scene */
        font-family: var(--font); color: var(--text);
        overflow: hidden;
      }

      /* ?preview — fake stream scene so you can eyeball the HUD in a browser */
      body.preview {
        background:
          radial-gradient(1000px 600px at 72% 8%, #2c1a5e, transparent),
          radial-gradient(800px 600px at 12% 95%, #10303a, transparent),
          #07060e;
      }

      #hud {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; align-items: stretch; gap: var(--gap);
        padding: 20px;
        opacity: 0; transform: translateY(10px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #hud.live { opacity: 1; transform: none; }

      /* ---- camera frame: neon-bordered space for your webcam ---------------- */
      .cam {
        flex: 0 0 440px;       /* larger camera */
        min-height: 210px;     /* taller HUD overall */
        position: relative;
        border-radius: var(--radius);
        border: 1.5px solid rgba(167, 134, 255, 0.55);
        box-shadow: var(--glow), inset 0 0 28px rgba(160, 107, 255, 0.12);
        background: linear-gradient(135deg, rgba(40, 24, 78, 0.28), rgba(12, 10, 24, 0.18));
      }
      .cam::before, .cam::after {
        content: ""; position: absolute; width: 22px; height: 22px;
        border: 2px solid var(--pink); filter: drop-shadow(0 0 6px var(--pink));
      }
      .cam::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
      .cam::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
      .cam .tag {
        position: absolute; top: 10px; left: 12px;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--muted); display: flex; align-items: center; gap: 6px;
      }
      .cam .tag .rec { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: pulse 1.4s infinite; }
      body.preview .cam { background: linear-gradient(135deg, #241640, #0f0c1c); }
      body.preview .cam .ph {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: rgba(169, 159, 206, 0.5); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
      }
      body.preview .cam .ph::after { content: "your camera"; }

      /* ---- cards ----------------------------------------------------------- */
      .card {
        flex: 1; min-width: 0; min-height: 210px;  /* taller */
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 15px 18px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--glow), 0 10px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: flex; flex-direction: column; gap: 10px;
        position: relative; overflow: hidden;
      }
      /* neon top edge */
      .card::before {
        content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--pink), transparent);
        opacity: 0.8;
      }
      .card.project { flex: 0 0 220px; }   /* narrower data boxes */
      .card.now { flex: 1; }
      .card.stats { flex: 0 0 430px; }     /* wider — room for more stats */

      .label {
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--accent); text-shadow: 0 0 10px rgba(160, 107, 255, 0.5);
        display: flex; align-items: center; gap: 7px; font-weight: 600;
      }
      .label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 9px var(--accent2); }
      .label .dot.paused { background: #f5b14c; box-shadow: 0 0 9px #f5b14c; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

      .project-name { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .branch { font-family: var(--mono); font-size: 11px; color: var(--muted); }

      .card.now { justify-content: center; }
      .now-title {
        font-size: 24px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        text-shadow: 0 0 18px rgba(160, 107, 255, 0.3);
      }
      .card.now .label { position: absolute; top: 15px; left: 18px; }
      .mode {
        align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        padding: 4px 11px; border-radius: 999px; color: #fff;
        background: linear-gradient(90deg, var(--accent), var(--pink));
        box-shadow: 0 0 16px rgba(255, 92, 240, 0.45);
      }

      /* latest milestones — capped, never scrolls (this is an overlay) */
      .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
      .log li {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: #ddd5f3; animation: slidein 0.35s ease;
      }
      .log li.dim { opacity: 0.5; }
      @keyframes slidein { from { opacity: 0; transform: translateX(-7px); } to { opacity: 1; transform: none; } }

      .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 18px; font-family: var(--mono); margin-top: 2px; }
      .stat { display: flex; flex-direction: column; }
      .stat .v { font-size: 20px; font-weight: 700; text-shadow: 0 0 14px rgba(160, 107, 255, 0.3); }
      .stat .k { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-family: var(--font); margin-top: 2px; }
      .v.add { color: var(--add); } .v.rem { color: var(--rem); } .v.tok { color: #c9aaff; } .v.cost { color: var(--accent2); }
      .v.streak { color: #ff9d4d; } .v.score { color: var(--pink); }

      .timer { font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="cam"><span class="tag"><span class="rec"></span> live</span><span class="ph"></span></div>

      <div class="card project">
        <div class="label"><span class="dot" id="proj-dot"></span>Project</div>
        <div class="project-name" id="proj-name">—</div>
        <div class="branch" id="proj-branch"></div>
        <div class="timer" id="timer"></div>
      </div>

      <div class="card now">
        <div class="label">Now Building</div>
        <div class="now-title" id="now-title">—</div>
        <span class="mode" id="now-mode" hidden></span>
      </div>

      <div class="card stats">
        <div class="label">Live Stats</div>
        <div class="stat-grid">
          <div class="stat"><span class="v add" id="s-feat">0</span><span class="k">features</span></div>
          <div class="stat"><span class="v rem" id="s-bugs">0</span><span class="k">fixes</span></div>
          <div class="stat"><span class="v" id="s-commits">0</span><span class="k">commits</span></div>
          <div class="stat"><span class="v tok" id="s-tok">0</span><span class="k">tokens</span></div>
          <div class="stat"><span class="v cost" id="s-cost">$0</span><span class="k">spend</span></div>
          <div class="stat"><span class="v" id="s-agents">0</span><span class="k">sub-agents</span></div>
          <div class="stat"><span class="v" id="s-prompts">0</span><span class="k">prompts</span></div>
          <div class="stat"><span class="v tok" id="s-tpm">0</span><span class="k">tok / min</span></div>
          <div class="stat"><span class="v cost" id="s-cph">$0</span><span class="k">spend / hr</span></div>
          <div class="stat"><span class="v streak" id="s-streak">0</span><span class="k">🔥 day streak</span></div>
          <div class="stat"><span class="v score" id="s-score">0</span><span class="k">⚡ vibe score</span></div>
          <div class="stat"><span class="v add" id="s-lph">0</span><span class="k">lines / hr</span></div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      if (new URLSearchParams(location.search).has("preview")) {
        document.body.classList.add("preview");
      }

      function fmt(n) {
        if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
        if (n >= 1_000) return (n / 1_000).toFixed(1) + "k";
        return String(n);
      }
      const money = (n) => (n >= 100 ? "$" + Math.round(n) : "$" + (n || 0).toFixed(2));

      function elapsed(startedAt) {
        if (!startedAt) return "";
        const s = Math.max(0, Math.floor((Date.now() - new Date(startedAt)) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return (h ? h + "h " : "") + String(m).padStart(2, "0") + "m " + String(sec).padStart(2, "0") + "s";
      }

      let last = "", state = null;

      function paint(d) {
        $("hud").classList.toggle("live", !!d.isLive);

        const dot = $("proj-dot");
        dot.classList.toggle("paused", d.project?.status === "paused");
        $("proj-name").textContent = d.project?.name ?? d.sessionTitle ?? "Vibe coding";
        $("proj-branch").textContent = d.branch ? "⌥ " + d.branch : "";

        if (d.nowBuilding) {
          $("now-title").textContent = d.nowBuilding.title;
          $("now-title").classList.remove("empty");
          const mode = $("now-mode");
          mode.textContent = d.nowBuilding.mode;
          mode.hidden = false;
        } else {
          $("now-title").textContent = "Getting set up…";
          $("now-title").classList.add("empty");
          $("now-mode").hidden = true;
        }

        const s = d.stats ?? {};
        $("s-feat").textContent = fmt(s.features ?? 0);
        $("s-bugs").textContent = fmt(s.bugs ?? 0);
        $("s-commits").textContent = fmt(s.commits ?? 0);
        $("s-tok").textContent = fmt(s.claudeTokens ?? 0);
        $("s-cost").textContent = money(s.costUsd ?? 0);
        $("s-agents").textContent = fmt(s.subAgents ?? 0);
        $("s-prompts").textContent = fmt(s.prompts ?? 0);

        $("s-streak").textContent = fmt(s.streak ?? 0);
        $("s-score").textContent = fmt(s.vibeScore ?? 0);

        // Burn rate + velocity — derived from session elapsed time.
        const mins = d.startedAt ? Math.max(1, (Date.now() - new Date(d.startedAt)) / 60000) : 0;
        const netLines = (s.linesAdded ?? 0) - (s.linesRemoved ?? 0);
        $("s-tpm").textContent = mins ? fmt(Math.round((s.claudeTokens ?? 0) / mins)) : "0";
        $("s-cph").textContent = mins ? money((s.costUsd ?? 0) / (mins / 60)) : "$0";
        $("s-lph").textContent = mins ? fmt(Math.round(netLines / (mins / 60))) : "0";
      }

      async function tick() {
        try {
          const res = await fetch("/state.json", { cache: "no-store" });
          const d = await res.json();
          state = d;
          const sig = JSON.stringify(d);
          if (sig !== last) { last = sig; paint(d); }
        } catch {
          $("hud").classList.remove("live");
        }
      }

      setInterval(tick, 1000);
      setInterval(() => { if (state?.isLive) $("timer").textContent = elapsed(state.startedAt); }, 1000);
      tick();
    </script>
  </body>
</html>
