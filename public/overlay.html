<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeLog Overlay</title>
    <style>
      :root {
        --glass: linear-gradient(165deg, rgba(38, 22, 72, 0.78), rgba(14, 11, 28, 0.82));
        --border: rgba(167, 134, 255, 0.34);
        --text: #f3f0ff;
        --muted: #a99fce;
        --accent: #a06bff;
        --accent2: #22d3a6;
        --pink: #ff5cf0;
        --radius: 16px;
        --gap: 14px;
        --glow: 0 0 22px rgba(160, 107, 255, 0.35);
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; font-family: var(--font); color: var(--text); overflow: hidden; }

      body.preview {
        background:
          radial-gradient(1000px 600px at 72% 8%, #2c1a5e, transparent),
          radial-gradient(800px 600px at 12% 95%, #10303a, transparent),
          #07060e;
      }

      #hud {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; align-items: stretch; gap: var(--gap); padding: 20px;
        opacity: 0; transform: translateY(10px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #hud.live { opacity: 1; transform: none; }

      /* ---- camera frame ---------------------------------------------------- */
      .cam {
        flex: 0 0 420px; min-height: 232px; position: relative;
        border-radius: var(--radius);
        border: 1.5px solid rgba(167, 134, 255, 0.55);
        box-shadow: var(--glow), inset 0 0 28px rgba(160, 107, 255, 0.12);
        background: linear-gradient(135deg, rgba(40, 24, 78, 0.28), rgba(12, 10, 24, 0.18));
      }
      .cam::before, .cam::after {
        content: ""; position: absolute; width: 22px; height: 22px;
        border: 2px solid var(--pink); filter: drop-shadow(0 0 6px var(--pink));
      }
      .cam::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
      .cam::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
      .cam .tag { position: absolute; top: 11px; left: 13px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .cam .tag .rec { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: pulse 1.4s infinite; }
      body.preview .cam { background: linear-gradient(135deg, #241640, #0f0c1c); }
      body.preview .cam .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(169, 159, 206, 0.5); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
      body.preview .cam .ph::after { content: "your camera"; }

      /* ---- cards ----------------------------------------------------------- */
      .card {
        flex: 1; min-width: 0; min-height: 232px;
        background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 15px 18px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--glow), 0 10px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
      }
      .card::before {
        content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1.5px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--pink), transparent); opacity: 0.8;
      }
      .card.projects { flex: 0 0 270px; }
      .card.now { flex: 1; }
      .card.stats { flex: 0 0 300px; }

      .label {
        font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600;
        color: var(--accent); text-shadow: 0 0 10px rgba(160, 107, 255, 0.5);
        display: flex; align-items: center; gap: 7px;
      }
      .label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 9px var(--accent2); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

      /* ---- projects ticker ------------------------------------------------- */
      .ticker { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
      .ticker li {
        display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 11px;
        background: rgba(255, 255, 255, 0.02); border: 1px solid transparent;
      }
      .ticker li.active {
        background: linear-gradient(90deg, rgba(160, 107, 255, 0.18), rgba(255, 92, 240, 0.05));
        border-color: rgba(167, 134, 255, 0.5);
        box-shadow: 0 0 16px rgba(160, 107, 255, 0.28);
      }
      .ticker .pdot { width: 8px; height: 8px; border-radius: 50%; background: #4a4570; flex: 0 0 auto; }
      .ticker li.active .pdot { background: var(--accent2); box-shadow: 0 0 9px var(--accent2); animation: pulse 1.4s infinite; }
      .ticker .pname { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .ticker li:not(.active) .pname { color: #b9b1d6; font-weight: 550; }
      .ticker .pnote { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 0 0 auto; }
      .ticker li.active .pnote { color: var(--accent2); }

      /* ---- now building feed ----------------------------------------------- */
      .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; }
      .feed li { display: flex; align-items: baseline; gap: 10px; }
      .feed .ftext { font-size: 15px; color: #c4bbe2; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .feed .fwhen { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 0 0 auto; }
      .feed .fwhen.now { color: var(--pink); font-size: 12px; }
      .feed li.current .ftext {
        font-size: 23px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
        white-space: normal; text-shadow: 0 0 18px rgba(160, 107, 255, 0.3);
      }
      .feed li.current { margin-bottom: 4px; }
      .feed li.current .bdot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); animation: pulse 1.3s infinite; flex: 0 0 auto; align-self: center; }

      /* ---- stats ----------------------------------------------------------- */
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 18px; font-family: var(--mono); margin-top: 2px; }
      .stat { display: flex; flex-direction: column; }
      .stat .v { font-size: 21px; font-weight: 700; text-shadow: 0 0 14px rgba(160, 107, 255, 0.3); }
      .stat .k { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-family: var(--font); margin-top: 2px; }
      .v.tok { color: #c9aaff; } .v.cost { color: var(--accent2); } .v.streak { color: #ff9d4d; }
      .ic-flame { width: 11px; height: 11px; vertical-align: -1px; color: #ff7a3d; fill: currentColor; filter: drop-shadow(0 0 4px rgba(255, 122, 61, 0.7)); }

      /* social strip in the stats card */
      .socials { display: flex; gap: 16px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 13px; }
      .socials .so { display: flex; align-items: center; gap: 6px; color: var(--muted); }
      .socials .so b { color: var(--text); font-weight: 700; }
      .socials .so svg { width: 14px; height: 14px; fill: currentColor; }
      .socials .so.tw { color: #b794ff; } .socials .so.yt { color: #ff6b81; }
      .socials .so .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 7px var(--pink); animation: pulse 1.4s infinite; }

      /* camera "off air" state when not streaming */
      .cam .tag.off { color: rgba(169, 159, 206, 0.6); }
      .cam .tag.off .rec { background: var(--muted); box-shadow: none; animation: none; }

      .timer { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: auto; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="cam"><span class="tag" id="camtag"><span class="rec"></span> <span id="camtagtext">live</span></span><span class="ph"></span></div>

      <div class="card projects">
        <div class="label"><span class="dot"></span> Projects</div>
        <ul class="ticker" id="projects"></ul>
        <div class="timer" id="timer"></div>
      </div>

      <div class="card now">
        <div class="label">Now Building</div>
        <ul class="feed" id="build"></ul>
      </div>

      <div class="card stats">
        <div class="label">Live Stats</div>
        <div class="stat-grid">
          <div class="stat"><span class="v" id="s-feat">0</span><span class="k">features built</span></div>
          <div class="stat"><span class="v" id="s-commits">0</span><span class="k">commits</span></div>
          <div class="stat"><span class="v" id="s-prompts">0</span><span class="k">prompts</span></div>
          <div class="stat"><span class="v" id="s-agents">0</span><span class="k">sub-agents</span></div>
          <div class="stat"><span class="v tok" id="s-tok">0</span><span class="k">tokens</span></div>
          <div class="stat"><span class="v cost" id="s-cost">$0</span><span class="k">spend</span></div>
          <div class="stat"><span class="v tok" id="s-tpm">0</span><span class="k">tok / min</span></div>
          <div class="stat"><span class="v streak" id="s-streak">0</span><span class="k"><svg class="ic-flame" viewBox="0 0 24 24"><path d="M12 2c1.2 3.2-1 4.4-2 6.4-.9 1.8.2 3.6 2 3.6 1.1 0 1.9-.9 2-2.6 1.9 1.9 3 4 3 6.2a7 7 0 1 1-14 0c0-3 1.7-5.2 3-7 .7 1.8 1.8 2 2.7 1.1C13.6 8 12.8 4.6 12 2Z"/></svg> day streak</span></div>
        </div>
        <div class="socials" id="socials" style="display:none"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      if (new URLSearchParams(location.search).has("preview")) document.body.classList.add("preview");

      const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n));
      const money = (n) => (n >= 100 ? "$" + Math.round(n) : "$" + (n || 0).toFixed(2));
      function since(ts) {
        if (!ts) return "";
        const s = Math.max(0, Math.floor((Date.now() - new Date(ts)) / 1000));
        if (s < 60) return "now";
        const m = Math.floor(s / 60);
        return m < 60 ? m + "m" : Math.floor(m / 60) + "h";
      }
      function clock(ts) {
        if (!ts) return "";
        return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }
      function elapsed(startedAt) {
        if (!startedAt) return "";
        const s = Math.max(0, Math.floor((Date.now() - new Date(startedAt)) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return (h ? h + "h " : "") + String(m).padStart(2, "0") + "m " + String(sec).padStart(2, "0") + "s";
      }

      // FLIP: animate rows sliding to new positions; new rows fade/slide in.
      function flipRender(el, items, makeLi) {
        const old = new Map();
        for (const li of el.children) old.set(li.dataset.key, li.getBoundingClientRect());
        el.innerHTML = "";
        for (const it of items) el.appendChild(makeLi(it));
        for (const li of el.children) {
          const prev = old.get(li.dataset.key);
          if (prev) {
            const dy = prev.top - li.getBoundingClientRect().top;
            if (dy) li.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }],
              { duration: 520, easing: "cubic-bezier(0.2,0.8,0.2,1)" });
          } else if (old.size) {
            li.animate([{ opacity: 0, transform: "translateY(-12px)" }, { opacity: 1, transform: "none" }],
              { duration: 460, easing: "ease" });
          }
        }
      }

      const TW_SVG = '<svg viewBox="0 0 24 24"><path d="M4 2 2.5 6v14h5v3h3l3-3h4L23 13V2H4Zm17 10-3 3h-5l-3 3v-3H6V4h15v8Z"/><path d="M16 7h2v5h-2zm-5 0h2v5h-2z"/></svg>';
      const YT_SVG = '<svg viewBox="0 0 24 24"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 5 12 5 12 5s-7 0-8.9.4A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1C5 19 12 19 12 19s7 0 8.9-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.4 12 31 31 0 0 0 23 7.5ZM9.8 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>';

      let last = "", state = null;

      function paint(d) {
        $("hud").classList.toggle("live", !!d.isLive);
        if (!d.isLive) return;

        // camera tag reflects real streaming status (OBS-driven)
        const camtag = $("camtag");
        camtag.classList.toggle("off", !d.streaming);
        $("camtagtext").textContent = d.streaming ? "live" : "off air";

        // social strip — live dot + follower/sub counts
        const soc = d.social, socEl = $("socials");
        const so = (cls, svg, ch) =>
          ch ? `<span class="so ${cls}">${svg}${ch.live ? '<span class="ldot"></span>' : ""}<b>${fmt(ch.followers ?? 0)}</b></span>` : "";
        if (soc && (soc.twitch || soc.youtube)) {
          socEl.innerHTML = so("tw", TW_SVG, soc.twitch) + so("yt", YT_SVG, soc.youtube);
          socEl.style.display = "flex";
        } else {
          socEl.style.display = "none";
        }

        // projects ticker
        flipRender($("projects"), d.projects ?? [], (p) => {
          const li = document.createElement("li");
          li.dataset.key = p.name;
          if (p.status === "active") li.className = "active";
          li.innerHTML = `<span class="pdot"></span><span class="pname"></span><span class="pnote"></span>`;
          li.querySelector(".pname").textContent = p.name;
          li.querySelector(".pnote").textContent = p.note ?? "";
          return li;
        });

        // now-building feed — newest (current) on top, big; previous dimmed below
        const feed = (d.buildLog ?? []).map((e) => (typeof e === "string" ? { text: e, ts: null } : e)).slice(0, 5);
        const buildEl = $("build");
        const oldB = new Map();
        for (const li of buildEl.children) oldB.set(li.dataset.key, li.getBoundingClientRect());
        buildEl.innerHTML = "";
        feed.forEach((e, idx) => {
          const li = document.createElement("li");
          li.dataset.key = (e.ts ?? "") + "|" + e.text;
          li.className = idx === 0 ? "current" : "";
          li.innerHTML = idx === 0
            ? `<span class="bdot"></span><span class="ftext"></span><span class="fwhen now"></span>`
            : `<span class="ftext"></span><span class="fwhen"></span>`;
          li.querySelector(".ftext").textContent = e.text;
          // timestamp of when this feature was requested — top is live "now"
          li.querySelector(".fwhen").textContent = idx === 0 ? "now" : clock(e.ts);
          buildEl.appendChild(li);
        });
        for (const li of buildEl.children) {
          const prev = oldB.get(li.dataset.key);
          if (prev) {
            const dy = prev.top - li.getBoundingClientRect().top;
            if (dy) li.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(0.2,0.8,0.2,1)" });
          } else if (oldB.size) {
            li.animate([{ opacity: 0, transform: "translateY(-14px)" }, { opacity: 1, transform: "none" }], { duration: 480, easing: "ease" });
          }
        }

        const s = d.stats ?? {};
        $("s-feat").textContent = fmt(s.features ?? 0);
        $("s-commits").textContent = fmt(s.commits ?? 0);
        $("s-prompts").textContent = fmt(s.prompts ?? 0);
        $("s-agents").textContent = fmt(s.subAgents ?? 0);
        $("s-tok").textContent = fmt(s.claudeTokens ?? 0);
        $("s-cost").textContent = money(s.costUsd ?? 0);
        $("s-streak").textContent = fmt(s.streak ?? 0);
        const mins = d.startedAt ? Math.max(1, (Date.now() - new Date(d.startedAt)) / 60000) : 0;
        $("s-tpm").textContent = mins ? fmt(Math.round((s.claudeTokens ?? 0) / mins)) : "0";
      }

      async function tick() {
        try {
          const d = await (await fetch("/state.json", { cache: "no-store" })).json();
          state = d;
          const sig = JSON.stringify(d);
          if (sig !== last) { last = sig; paint(d); }
        } catch { $("hud").classList.remove("live"); }
      }
      setInterval(tick, 1000);
      setInterval(() => { if (state?.isLive) $("timer").textContent = elapsed(state.startedAt); }, 1000);
      tick();
    </script>
  </body>
</html>
