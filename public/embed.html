<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeLog · Embed</title>
    <style>
      /* ---------------------------------------------------------------------
         Compact embeddable widget (G4). Lives in an <iframe> on the user's own
         site (injected by /embed.js). The body is TRANSPARENT so it blends into
         whatever page hosts it; the widget itself is one self-contained glass
         card. Data contract is identical to /live: GET /state.json,
         /api/profile.json, /api/theme.json?page=live — no new server surface.
      --------------------------------------------------------------------- */
      :root {
        --text: #f3f0ff;
        --muted: #a99fce;
        --accent: #a06bff;
        --accent2: #22d3a6;
        --pink: #ff5cf0;
        --live: #ff4d5e;
        --bg: #07060e;
        --g1: var(--accent); --g2: var(--pink); --g3: var(--accent2);
        --aurora1: #3a1d7a; --aurora2: #0f3a44;
        --glass: linear-gradient(165deg, rgba(38, 22, 72, 0.66), rgba(14, 11, 28, 0.72));
        --border: rgba(167, 134, 255, 0.30);
        --glow: 0 0 22px rgba(160, 107, 255, 0.22);
        --radius: 16px;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--font); color: var(--text);
        background: transparent; /* blends into the host page */
        padding: 6px; overflow: hidden;
      }
      a { color: inherit; }

      @property --vlangle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
      @keyframes vlspin { to { --vlangle: 360deg; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.22; } }
      @keyframes textflow { to { background-position: 250% 0; } }

      /* the card */
      .card {
        position: relative; height: 100%; width: 100%;
        display: flex; flex-direction: column; gap: 10px;
        padding: 15px 17px; border-radius: var(--radius);
        background: var(--glass), var(--bg); border: 1px solid var(--border);
        box-shadow: var(--glow), 0 12px 30px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.05);
        overflow: hidden; isolation: isolate;
      }
      /* contained aurora glow (clipped by the card, so the widget self-contains) */
      .card::before {
        content: ""; position: absolute; z-index: -1; inset: -40%;
        background:
          radial-gradient(40% 50% at 80% 0%, var(--aurora1), transparent 70%),
          radial-gradient(45% 55% at 10% 100%, var(--aurora2), transparent 70%);
        opacity: 0.55; filter: blur(28px); pointer-events: none;
      }
      /* travelling gradient ring (matches the /live look) */
      .card::after {
        content: ""; position: absolute; inset: 0; border-radius: var(--radius); padding: 1.5px;
        background: conic-gradient(from var(--vlangle), transparent 30%, var(--g1) 50%, var(--g2) 64%, var(--g3) 76%, transparent 92%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        animation: vlspin 26s linear infinite;
      }

      /* header */
      .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; letter-spacing: -0.01em; min-width: 0; }
      .brand .spark { width: 18px; height: 18px; border-radius: 6px; flex: 0 0 auto; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 14px rgba(124,92,255,0.55); }
      .brand .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(255,77,94,0.14); color: var(--live); border: 1px solid rgba(255,77,94,0.35); }
      .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: pulse 1.4s infinite; }
      .pill.off { background: rgba(255,255,255,0.05); color: var(--muted); border-color: var(--border); }
      .pill.off .dot { animation: none; box-shadow: none; }

      /* now-building */
      .now { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .eyebrow { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: var(--pink); }
      .title {
        margin: 0; font-size: clamp(16px, 4.6vw, 21px); font-weight: 850; letter-spacing: -0.02em; line-height: 1.12;
        background: linear-gradient(100deg, #fff 0%, var(--pink) 36%, var(--accent) 62%, #fff 86%);
        background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: textflow 9s linear infinite;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .proj { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .proj b { color: var(--text); font-weight: 600; }

      /* compact stat strip */
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: auto; }
      .stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(167,134,255,0.14); border-radius: 10px; padding: 7px 8px; text-align: center; }
      .stat .v { font-family: var(--mono); font-weight: 800; font-size: 15px; line-height: 1; }
      .stat .v.tok { color: #c9aaff; } .stat .v.streak { color: #ff9d4d; }
      .stat .k { font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

      /* powered-by footer (the viral loop badge) */
      .by { display: flex; align-items: center; justify-content: center; }
      .by a { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); transition: color 0.2s; }
      .by a:hover { color: var(--text); }
      .by .zap { width: 11px; height: 11px; }
      .by strong { background: linear-gradient(90deg, var(--accent), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }

      /* offline collapses to a slim state */
      body.offline .now, body.offline .stats { display: none; }
      .off-msg { display: none; flex: 1; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; color: var(--muted); }
      body.offline .off-msg { display: flex; }
      .off-msg .z { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }

      @media (prefers-reduced-motion: reduce) {
        .card::after, .pill .dot, .title { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="brand"><span class="spark"></span> <span class="nm" id="brandName">VibeLog</span></div>
        <span class="pill" id="pill"><span class="dot"></span> <span id="pillText">Live</span></span>
      </div>

      <div class="off-msg"><span class="z"></span> Offline — back soon</div>

      <div class="now">
        <div class="eyebrow" id="eyebrow">Now Building</div>
        <h1 class="title" id="title">Getting set up…</h1>
        <div class="proj"><b id="project">—</b><span id="branch"></span></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v" id="s-feat">0</div><div class="k">features</div></div>
        <div class="stat"><div class="v" id="s-commits">0</div><div class="k">commits</div></div>
        <div class="stat"><div class="v tok" id="s-tok">0</div><div class="k">tokens</div></div>
        <div class="stat"><div class="v streak" id="s-streak">0</div><div class="k">streak</div></div>
      </div>

      <div class="by">
        <a id="byLink" href="/live" target="_blank" rel="noopener">
          <svg class="zap" viewBox="0 0 24 24" fill="none" stroke="url(#zg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#ff5cf0"/></linearGradient></defs><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
          powered by <strong>VibeLog</strong>
        </a>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n ?? 0);

      // Theme (allowlisted CSS vars) — same source as /live.
      async function applyTheme() {
        try {
          const { vars } = await (await fetch("/api/theme.json?page=live", { cache: "no-store" })).json();
          const s = document.documentElement.style;
          for (const k in vars) s.setProperty(k, vars[k]);
        } catch { /* keep :root defaults */ }
      }

      // Public display name only (rendered via textContent — no markup injection).
      async function applyProfile() {
        try {
          const { profile } = await (await fetch("/api/profile.json", { cache: "no-store" })).json();
          $("brandName").textContent = (profile && profile.displayName) || "VibeLog";
        } catch { /* keep default */ }
      }

      let last = "";
      function paint(d) {
        document.body.classList.toggle("offline", !d.isLive);
        if (!d.isLive) return;

        $("pillText").textContent = d.streaming ? "Live" : "Online";
        $("pill").classList.toggle("off", !d.streaming);
        $("eyebrow").textContent = d.streaming ? "Now Building · Live" : "Now Building";
        $("title").textContent = d.nowBuilding ? d.nowBuilding.title : "Getting set up…";
        $("project").textContent = (d.project && d.project.name) || d.sessionTitle || "Vibe coding";
        $("branch").textContent = d.branch ? " · " + d.branch : "";

        const s = d.stats || {};
        $("s-feat").textContent = fmt(s.features ?? 0);
        $("s-commits").textContent = fmt(s.commits ?? 0);
        $("s-tok").textContent = fmt(s.claudeTokens ?? 0);
        $("s-streak").textContent = fmt(s.streak ?? 0);
      }

      async function tick() {
        try {
          const d = await (await fetch("/state.json", { cache: "no-store" })).json();
          const sig = JSON.stringify(d);
          if (sig !== last) { last = sig; paint(d); }
        } catch { document.body.classList.add("offline"); }
      }

      applyTheme(); applyProfile(); tick();
      setInterval(tick, 4000);
      setInterval(applyTheme, 30000);
      setInterval(applyProfile, 30000);
    </script>
  </body>
</html>
