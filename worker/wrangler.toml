# wrangler.toml — VibeLog public Worker (PR3 / Task C)
#
# Before deploying, the user must:
#   1. `cd worker && npm install`          (install @cloudflare/workers-types)
#   2. `wrangler kv namespace create SNAPSHOTS`
#      → copy the returned id into kv_namespaces[0].id below
#   3. `wrangler secret put PUBLISH_TOKEN` (enter a strong random secret)
#   4. `wrangler deploy`
#
# See worker/README.md for the full step-by-step deploy guide.

name       = "vibelog-live"
main       = "src/worker.ts"
# Workers with static assets require Wrangler ≥ 3.60.  Pin to compat date ≥ 2024-09.
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# Static assets — serves worker/public/ at the Worker's origin.
# Wrangler copies these files at deploy time; no build step needed.
# worker/public/ holds copies of public/{live.html,embed.html,embed.js}, made by
# scripts/sync-worker-public.mjs (`npm run deploy` runs it; CI fails on drift).
# The Worker redirects / to https://vibelogs.dev and rewrites /live and /embed.
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding   = "ASSETS"
# Serve files at their exact path — no .html→extensionless 307 redirects. The
# Worker explicitly rewrites "/live" → /live.html and "/embed" → /embed.html, so
# we want ASSETS to return those files directly (200), not redirect them.
html_handling      = "none"
not_found_handling = "none"

# ---------------------------------------------------------------------------
# KV namespace — the snapshot store
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "ce9484441acb4b218768b0ecdfbcf13e"
preview_id = "181065580ec043bd8d89a61c8bed8a9c"

# ---------------------------------------------------------------------------
# Secret
# PUBLISH_TOKEN is set via `wrangler secret put PUBLISH_TOKEN` (not stored here).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Dollar spend: /state.json strips stats.costUsd unless this is "true" (the
# owner's explicit opt-in, matching publicShowCost in the local settings).
# ---------------------------------------------------------------------------
# [vars]
# PUBLIC_SHOW_COST = "true"
